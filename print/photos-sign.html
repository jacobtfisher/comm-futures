<title>Futures photo sign</title>
<!--
  Letter-size sign for the conference. Print from a browser (File > Print,
  margins: none) or regenerate the PDF:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --print-to-pdf=print/photos-sign.pdf --no-pdf-header-footer print/photos-sign.html

  The QR is inlined from images/photos-qr.svg and encodes

  survives any change of upload target.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

  }
  h1 {

    font-weight: 900; font-size: 54pt; line-height: .98; letter-spacing: -.01em;
    margin: 0 0 .3in;
  }
  .qr-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    border-top: 4px solid #111827; border-bottom: 4px solid #111827;
  }
  .qr-wrap svg { width: 4.4in; height: 4.4in; }
  .url {
    font-family: "JetBrains Mono", monospace; font-weight: 700;
    font-size: 24pt; letter-spacing: .04em; text-align: center; margin: .3in 0 .12in;
  }
  .alt {
    font-size: 14pt; line-height: 1.4; text-align: center; margin: 0; color: #374151;
  }
  .alt strong { color: #111827; font-weight: 600; }
  .foot {
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 10pt;
    letter-spacing: .1em; text-transform: uppercase; text-align: center;
    color: #6b7280; margin-top: .3in;

</style>
